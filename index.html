<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Armin Busatlic Frontend Developer | Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/arminImage.jpeg" />
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="/src/styles.scss" />

    <script>
      (function () {
        document.documentElement.dataset["darkModeAnimated"] = "false";
        const storedMode = localStorage.getItem("darkModeSignal");
        const isDarkMode = storedMode
          ? JSON.parse(storedMode) === "dark"
          : false;

        if (isDarkMode) {
          document.documentElement.classList.remove("light");
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-800">
    <app-root></app-root>
    <script type="module" src="/src/main.ts" defer></script>
  </body>
</html>
